name: work_pulse
description: "Workforce monitoring app for field jobs, attendance, and live location"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  supabase_flutter: ^2.9.1
  google_fonts: ^6.3.2
  fl_chart: ^1.1.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  image_picker: ^1.2.0
  signature: ^6.0.0
  permission_handler: ^12.0.1
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.env.example
